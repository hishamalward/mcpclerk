[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpclerk"
version = "0.2.0"
description = "Manage MCP configuration for Claude Code and Codex."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hisham Al-Ward" }]
dependencies = ["tomlkit>=0.13,<1"]
keywords = ["mcp", "model-context-protocol", "server-catalog", "configuration"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcpclerk = "mcpclerk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcpclerk = ["mcp_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
