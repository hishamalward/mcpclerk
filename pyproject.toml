[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpclerk"
version = "0.1.0"
description = "A governance proxy for MCP servers: per-tool allowlist, human approval for write-class tools, quotas, secret redaction, and a hash-chained audit log."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hisham Al-Ward" }]
dependencies = ["mcp>=2.0,<3", "pyyaml>=6"]
keywords = ["mcp", "model-context-protocol", "ai-agents", "guardrails", "audit-log", "human-in-the-loop", "security"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
mcpclerk = "mcpclerk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
